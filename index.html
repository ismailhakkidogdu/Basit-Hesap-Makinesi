<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İsmail'in Hesap Makinesi</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        h1 { margin-bottom: 20px; font-size: 24px; color: #4ade80; }
        .calculator {
            background-color: #1e1e1e;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            width: 320px;
        }
        #display {
            width: 100%;
            height: 60px;
            background-color: #2c2c2c;
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 28px;
            text-align: right;
            padding: 10px 15px;
            margin-bottom: 15px;
        }
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }
        button {
            height: 55px;
            font-size: 20px;
            border: none;
            border-radius: 10px;
            background-color: #333333;
            color: white;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background-color: #444444; }
        .operator { background-color: #f59e0b; color: #000; font-weight: bold; }
        .operator:hover { background-color: #d97706; }
        .equal { background-color: #22c55e; color: #000; font-weight: bold; grid-column: span 2; }
        .equal:hover { background-color: #16a34a; }
        .clear { background-color: #ef4444; font-weight: bold; }
        .clear:hover { background-color: #dc2626; }
    </style>
</head>
<body>

    <h1>İsmail'in Hesap Makinesi</h1>

    <div class="calculator">
        <input type="text" id="display" disabled placeholder="0">
        <div class="buttons">
            <button class="clear" onclick="clearDisplay()">C</button>
            <button onclick="deleteLast()">⌫</button>
            <button class="operator" onclick="appendValue('/')">÷</button>
            <button class="operator" onclick="appendValue('*')">×</button>

            <button onclick="appendValue('7')">7</button>
            <button onclick="appendValue('8')">8</button>
            <button onclick="appendValue('9')">9</button>
            <button class="operator" onclick="appendValue('-')">-</button>

            <button onclick="appendValue('4')">4</button>
            <button onclick="appendValue('5')">5</button>
            <button onclick="appendValue('6')">6</button>
            <button class="operator" onclick="appendValue('+')">+</button>

            <button onclick="appendValue('1')">1</button>
            <button onclick="appendValue('2')">2</button>
            <button onclick="appendValue('3')">3</button>
            <button onclick="appendValue('.')">.</button>

            <button onclick="appendValue('0')">0</button>
            <button class="equal" onclick="calculate()">=</button>
        </div>
    </div>

    <script>
        const display = document.getElementById('display');
        function appendValue(val) { display.value += val; }
        function clearDisplay() { display.value = ''; }
        function deleteLast() { display.value = display.value.slice(0, -1); }
        function calculate() {
            try {
                if (display.value === '') return;
                display.value = eval(display.value);
            } catch {
                display.value = 'Hata';
            }
        }
    </script>

</body>
</html>
